{% extends 'base.html' %}
{% block content %}
<h2>{% if modo == 'novo' %}➕ Novo Usuário{% else %}✏️ Editar Usuário{% endif %}</h2>

<form method="post" class="form-grid" style="max-width:640px;">
  {% if modo == 'novo' %}
    <div class="full">
      <label>Usuário *</label>
      <input type="text" name="username" required
             value="{{ request.form.get('username','') }}">
    </div>
  {% else %}
    <div class="full">
      <label>Usuário</label>
      <input type="text" value="{{ u.username }}" disabled>
      <p class="small">O login não pode ser alterado.</p>
    </div>
  {% endif %}

  <div class="full">
    <label>{% if modo == 'novo' %}Senha *{% else %}Nova senha (deixe em branco para manter){% endif %}</label>
    <input type="password" name="senha" {% if modo=='novo' %}required{% endif %}>
  </div>

  <div class="full">
    <label>Perfil *</label>
    <select name="perfil" required>
      {% for p in perfis_disponiveis %}
        <option value="{{ p }}"
          {% if (u and u.perfil == p) or (not u and p == 'Operador') %}selected{% endif %}>
          {{ p }}
        </option>
      {% endfor %}
    </select>
  </div>

  {% if modo == 'editar' %}
  <div class="full">
    <label>
      <input type="checkbox" name="ativo" style="width:auto;"
             {% if u.ativo %}checked{% endif %}> Usuário ativo
    </label>
  </div>
  {% endif %}

  <div class="full">
    <button type="submit">
      {% if modo == 'novo' %}Criar usuário{% else %}Salvar alterações{% endif %}
    </button>
    <a href="{{ url_for('usuarios_lista') }}" class="btn btn-sec">Cancelar</a>
  </div>
</form>
{% endblock %}
